name: Docker - Build & Publish

on:
  # Automatic: fires when a GitHub Release is published.
  release:
    types: [published]

  # Manual: lets you specify an explicit image tag (defaults to the release/ref
  # name) and choose whether to actually push.
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Image tag override (e.g. "1.2.3", "my-feature").
          Defaults to the ref name (branch / tag) when left blank.
        required: false
        default: ""
      push:
        description: Push the built image to Docker Hub?
        type: boolean
        default: true

jobs:
  docker:
    name: Build & push (${{ matrix.python_version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so uv-dynamic-versioning resolves tags

      - name: Resolve image tag
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            # github.ref_name is the release tag (e.g. "v1.2.3") on releases,
            # and the branch name on workflow_dispatch from a branch.
            TAG="${{ github.ref_name }}"
          fi
          # Strip a leading "v" so Docker tags are plain semver (1.2.3, not v1.2.3)
          TAG="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' || inputs.push == true }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python_version }}
          tags: |
            dockerhubaneo/armonik-cli:python-${{ matrix.python_version }}-${{ steps.resolve.outputs.tag }}
            dockerhubaneo/armonik-cli:python-${{ matrix.python_version }}
          # Layer caching via GitHub Actions cache backend
          cache-from: type=gha,scope=python-${{ matrix.python_version }}
          cache-to:   type=gha,scope=python-${{ matrix.python_version }},mode=max

      - name: Write job summary
        run: |
          echo "## Docker image published " >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python | \`${{ matrix.python_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`${{ steps.resolve.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Digest | \`${{ steps.build.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
